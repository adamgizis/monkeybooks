<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>monkeybooks</title>
  </head>
  <body>
    <div id="app">
      <header>
        <a class="logo" href="/">
          <span class="logo-top">monkey see</span>
          <span class="logo-name">monkey<span>books</span></span>
        </a>
        <nav>
          <button id="library-btn" class="text-btn" title="your books">library</button>
          <button id="upload-btn" class="text-btn" title="upload a pdf, epub or txt">+ upload</button>
        </nav>
      </header>

      <div id="config">
        <div class="group">
          <button data-toggle="punctuation">@ punctuation</button>
          <button data-toggle="capitals">Aa capitals</button>
        </div>
        <div class="sep"></div>
        <div class="group">
          <span class="label">words</span>
          <button data-chunk="25">25</button>
          <button data-chunk="50">50</button>
          <button data-chunk="100">100</button>
          <button data-chunk="250">250</button>
        </div>
      </div>

      <main>
        <section id="test">
          <div id="book-bar">
            <span id="book-title"></span>
            <div id="book-progress" title="click to jump to a position in the book">
              <div id="book-progress-fill"></div>
            </div>
            <span id="book-progress-label"></span>
          </div>

          <div id="live">
            <span id="live-count"></span>
            <span id="live-wpm"></span>
            <span id="live-acc"></span>
          </div>

          <div id="words-wrapper">
            <div id="caret"></div>
            <div id="words"></div>
            <div id="focus-overlay">click here or press any key to focus</div>
          </div>
          <input
            id="hidden-input"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="typing input"
          />

          <button id="restart-btn" class="icon-btn" title="restart (tab)">&#x21bb;</button>
        </section>

        <section id="result" hidden>
          <div class="result-main">
            <div class="stat big"><div class="label">wpm</div><div id="res-wpm" class="value"></div></div>
            <div class="stat big"><div class="label">acc</div><div id="res-acc" class="value"></div></div>
          </div>
          <div class="result-more">
            <div class="stat"><div class="label">raw</div><div id="res-raw" class="value"></div></div>
            <div class="stat">
              <div class="label">characters</div>
              <div id="res-chars" class="value" title="correct / incorrect / extra / missed"></div>
            </div>
            <div class="stat"><div class="label">time</div><div id="res-time" class="value"></div></div>
            <div class="stat"><div class="label">book</div><div id="res-book" class="value"></div></div>
          </div>
          <div class="result-actions">
            <button id="next-btn" class="icon-btn" title="next chunk (enter)">&#x276F;</button>
            <button id="retry-btn" class="icon-btn" title="repeat this chunk (tab)">&#x21bb;</button>
          </div>
        </section>
      </main>

      <footer>
        <span><kbd>tab</kbd> restart</span>
        <span><kbd>enter</kbd> next chunk</span>
        <span><kbd>ctrl</kbd>+<kbd>backspace</kbd> delete word</span>
      </footer>
    </div>

    <div id="library" class="modal" hidden>
      <div class="modal-box">
        <div class="modal-head">
          <h2>library</h2>
          <button id="library-close" class="text-btn">esc</button>
        </div>
        <button id="library-upload" class="dropzone">
          drop a <b>.pdf</b>, <b>.epub</b> or <b>.txt</b> here, or click to choose
        </button>
        <ul id="book-list"></ul>
      </div>
    </div>

    <div id="drop-overlay" hidden><div>drop to add to your library</div></div>
    <div id="toast" hidden></div>
    <input type="file" id="file-input" accept=".pdf,.epub,.txt,.text,.md,.markdown,.html,.htm" hidden />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
